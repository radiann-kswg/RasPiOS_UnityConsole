# =============================================================
# RasPiOS_UnityConsole 設定ファイル
# ブートパーティション上にあるため、SDカードをWindowsで開いて編集できます。
# 変更後は Raspberry Pi を再起動してください。
# 書式: KEY=VALUE（行頭 # はコメント）
# =============================================================

# --- Type-C USBガジェット（ネットワーク側。シリアル(ACM)は常に併存） ---
# ncm   : 既定。Windows 11 / 10(21H2以降) の標準ドライバで動作
# rndis : NCMが認識されない古いWindows向け
# ecm   : Linux/macOSホスト向け
USB_FUNCTION=ncm

# Pi側 usb0 のIPアドレス（変更時は /etc/dnsmasq.d/usb0.conf も揃えること）
# SSH保守リンク: ssh player@10.89.0.1
PI_IP=10.89.0.1
PI_PREFIX=24

# --- 本体の USB ポート（ゲームカセット・コントローラ）の速度 ---
# high  : 既定。青い USB 3.0 ポートも USB 2.0 として動かす。
#         Type-C 1本の給電では USB 3.0 のメモリが読み出し途中で固まるため（Pi 4 で確認）
# super : USB 3.0 も有効にする（十分な電源がある場合）
USB_HOST_SPEED=high

# --- HDMI の画面解像度 ---
# 空       : 既定。画面が推奨する解像度（1080p の画面なら 1920x1080）
# 1280x720 : Unity ゲームは全画面を画面解像度で描くため、Pi 4 + 1080p 画面で重いときに下げる
#            （Pi 4B の NTs Loto Watch 平均: 1080p 17〜25fps → 720p 19〜28fps、2026-09-30 実測）
HDMI_MODE=

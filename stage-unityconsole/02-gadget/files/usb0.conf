# unitycon: usb0 (Type-C USBガジェットリンク) に対する DHCP サーバ設定
# PI_IP (10.89.0.1) を変更する場合は /boot/firmware/unitycon.conf と本ファイルの両方を揃えること。
# 注: GadgetMonitor 10.87.0.0/24 / NTsWallpaper 10.88.0.0/24 / Pi5仮OS 10.86.0.0/24 と
#     同時接続しても衝突しないよう 10.89.0.0/24 を使用。
# dhcp-option=3 / 6 を空指定にしているのは、PC側の既定ゲートウェイ・DNSを
# このリンクで奪わないため（PCのインターネット接続に影響を与えない）。
interface=usb0
bind-dynamic
dhcp-range=10.89.0.10,10.89.0.20,255.255.255.0,12h
dhcp-option=3
dhcp-option=6
dhcp-authoritative
